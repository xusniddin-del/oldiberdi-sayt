<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>So'rovnoma — Oldi-Berdi</title>
<meta name="description" content="Oldi-Berdi foydalanuvchilari uchun 2 daqiqalik so'rovnoma">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b5c33">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#edf5ef;--surface:#fff;--surface-2:#f3f7f4;--brand:#13894a;--brand-deep:#0b5c33;--pos-bg:#e3f4e9;--line:#dfe9e2;--muted:#6b7d72;--fg:#0e2a1b;--neg:#c2401f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit}
.head{background:linear-gradient(150deg,#0b5c33,#1a9c55);color:#fff;padding:14px 16px 44px}
.hin{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.hin a.home{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;flex:1;min-width:0}
.hin img{width:42px;height:42px;border-radius:12px;flex:none;background:#fff}
.hin b{display:block;font-size:18px}.hin small{display:block;opacity:.85;font-size:13px}
.lang{display:flex;background:rgba(255,255,255,.16);border-radius:12px;padding:3px;flex:none}
.lang button{border:0;background:none;color:#fff;font-weight:700;font-size:13px;padding:6px 10px;border-radius:9px;cursor:pointer}
.lang button.on{background:#fff;color:var(--brand-deep)}
main{max-width:680px;margin:-30px auto 0;padding:0 12px 40px}
.card{background:var(--surface);border-radius:22px;padding:18px 16px;box-shadow:0 12px 30px -18px rgba(11,60,33,.35)}
.intro{margin:0 0 12px;color:var(--muted);line-height:1.5}
.note{background:#fff4d6;color:#7a5300;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.prog{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .3s}
.pt{text-align:right;font-size:12px;color:var(--muted);margin:4px 0 6px}
.q{padding:16px 0;border-top:1px solid var(--line)}.q.miss .t b{color:var(--neg)}
.t{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:10px}.t b{flex:1;min-width:200px;font-size:16px;line-height:1.35}.t small{width:100%;margin-left:34px;color:var(--muted);font-size:12.5px;margin-top:-4px}
.n{width:26px;height:26px;border-radius:9px;background:var(--pos-bg);color:var(--brand);display:inline-grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.opts{display:grid;gap:7px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-size:15px;cursor:pointer}
.opt.on{border-color:var(--brand);background:var(--pos-bg);font-weight:700}
.box{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}.box.many{border-radius:7px}
.opt.on .box{background:var(--brand);border-color:var(--brand)}.box svg{width:14px;height:14px}
.scale{display:grid;gap:6px;grid-template-columns:repeat(5,minmax(0,1fr))}.scale.nps{grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.num{height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font-weight:800;font-size:16px;cursor:pointer;padding:0}
.num.on{background:var(--brand);border-color:var(--brand);color:#fff}.scale.nps .num{height:40px;font-size:14px;border-radius:10px}
.lohi{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;color:var(--fg);outline:none}.inp:focus{border-color:var(--brand);background:#fff}
textarea.inp{resize:vertical;min-height:84px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:480px){.row2{grid-template-columns:1fr}}
.err{color:var(--neg);font-size:14px;min-height:18px;margin:8px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border:0;border-radius:16px;background:var(--brand);color:#fff;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.6}.btn svg{width:20px;height:20px}
.btn.ghost{background:var(--surface-2);color:var(--fg);margin-top:8px}
.done{text-align:center;padding:10px 0}.done h2{margin:12px 0 6px}.done p{color:var(--muted);line-height:1.5}
.ok{width:72px;height:72px;border-radius:50%;background:var(--pos-bg);color:var(--brand);display:grid;place-items:center;margin:0 auto}.ok svg{width:36px;height:36px}
.video{background:var(--pos-bg);color:var(--fg)!important;border-radius:12px;padding:10px 12px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);margin:20px auto;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}.foot a{color:var(--brand);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header class="head"><div class="hin"><a class="home" href="/"><img src="/img/icon-96.png" alt=""><span><b>Oldi-Berdi</b><small id="sub">So'rovnoma · 2 daqiqa</small></span></a><div class="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button></div></div></header>
<main><div class="card" id="box"><div class="spin"></div></div><div class="foot"><a href="/">oldiberdi.uz</a></div></main>
<script>
var API='https://script.google.com/macros/s/AKfycbxgQB_WHAKwLpcBItVWcwgr3Uf3S0GDOlxwp-VqyY0IaP3SkBN89sgrUKzyrfuKuRDv/exec';
var APP='https://xusniddin-del.github.io/Oldi-berdi-ilovasi/';
var Q=new URLSearchParams(location.search);
var L=(Q.get('l')||'').toLowerCase()==='ru'||(!Q.get('l')&&/^ru/i.test(navigator.language||'')&&!/uz/i.test(navigator.language||''))?'ru':'uz';
var RU={"So'rovnoma · 2 daqiqa":"Опрос · 2 минуты","So'rovnoma yakunlangan":"Опрос завершён","Qatnashganlarga rahmat!":"Спасибо всем участникам!","Ilovani ochish":"Открыть приложение","Rahmat!":"Спасибо!","Javoblaringiz bizga yetib keldi. Har bir fikrni o'qib chiqamiz va ilovani yaxshilaymiz.":"Ваши ответы получены. Мы читаем каждый отзыв и улучшаем приложение.","Video uchun rozilik berdingiz — tez orada siz bilan bog'lanamiz.":"Вы согласились на видео — скоро свяжемся с вами.","Siz allaqachon javob bergansiz. Qayta yuborsangiz, javobingiz yangilanadi.":"Вы уже отвечали. Если отправите снова, ответ обновится.","Oldi-Berdi'ni siz uchun qulayroq qilmoqchimiz. Bir necha savolga javob bering — 2 daqiqa vaqt oladi.":"Хотим сделать Oldi-Berdi удобнее для вас. Ответьте на несколько вопросов — это займёт 2 минуты.","ixtiyoriy":"необязательно","bir nechtasini tanlang":"можно выбрать несколько","Ismingiz va telefoningiz":"Ваше имя и телефон","video uchun kerak":"нужно для видео","Ism":"Имя","Javobni yuborish":"Отправить ответ","Yuborilmoqda…":"Отправляем…","Iltimos, belgilangan savollarga javob bering":"Пожалуйста, ответьте на отмеченные вопросы","Video uchun telefon raqamingizni yozing":"Для видео укажите номер телефона","Internetga ulanib bo'lmadi. Qayta urinib ko'ring.":"Нет соединения с интернетом. Попробуйте ещё раз.","Saytga qaytish":"Вернуться на сайт","Ilovada akkauntingizdagi raqamni yozsangiz, javob sizning akkauntingizga bog'lanadi.":"Укажите номер из вашего аккаунта — ответ привяжется к нему."};
function tr(s){return L==='ru'&&RU[s]?RU[s]:s}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function vl(a){return Array.isArray(a)?(L==='ru'?a[1]:a[0]):(a||'')}
function $(s){return document.querySelector(s)}
var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var SEND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4 18-7z"/></svg>';
function normPhone(p){var d=String(p||'').replace(/\D/g,'');if(d.length===9)d='998'+d;return d}
function fphone(p){p=normPhone(p);return p.length===12?'+'+p.slice(0,3)+' '+p.slice(3,5)+' '+p.slice(5,8)+' '+p.slice(8,10)+' '+p.slice(10):p?'+'+p:''}
function api(action,data){var body={action:action,lang:L};for(var k in data)body[k]=data[k];
 return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}).catch(function(){throw new Error(tr("Internetga ulanib bo'lmadi. Qayta urinib ko'ring."))}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error||'Xatolik');return j})}
var SV={q:null,on:true,ans:{},done:false,err:'',name:Q.get('n')||'',phone:Q.get('p')?fphone(Q.get('p')):''};
var KEY='oldiberdi_sv_draft';
function save(){try{localStorage.setItem(KEY,JSON.stringify({ans:SV.ans,name:SV.name,phone:SV.phone}))}catch(e){}}
try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){SV.ans=d.ans||{};if(!SV.name)SV.name=d.name||'';if(!SV.phone)SV.phone=d.phone||''}}catch(e){}
function shown(q){if(q.id==='q7'){var v=SV.ans.q6;return Array.isArray(v)&&v.some(function(i){return i!==6})}if(!q.if)return true;return q.if[1].indexOf(SV.ans[q.if[0]])>=0}
function filled(q){var v=SV.ans[q.id];return v!==undefined&&!(Array.isArray(v)&&!v.length)}
function draw(){var box=$('#box');$('#sub').textContent=tr("So'rovnoma · 2 daqiqa");
 [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.className=b.dataset.l===L?'on':''});document.documentElement.lang=L;
 if(!SV.q)return;
 if(!SV.on){box.innerHTML='<div class="done"><div class="ok">'+CHK+'</div><h2>'+tr("So'rovnoma yakunlangan")+'</h2><p>'+tr('Qatnashganlarga rahmat!')+'</p><a class="btn" href="'+APP+'">'+tr('Ilovani ochish')+'</a><a class="btn ghost" href="/">'+tr('Saytga qaytish')+'</a></div>';return}
 if(SV.done===true){box.innerHTML='<div class="done"><div class="ok">'+CHK+'</div><h2>'+tr('Rahmat!')+'</h2><p>'+tr("Javoblaringiz bizga yetib keldi. Har bir fikrni o'qib chiqamiz va ilovani yaxshilaymiz.")+'</p>'+(SV.vid?'<p class="video">🎥 '+tr("Video uchun rozilik berdingiz — tez orada siz bilan bog'lanamiz.")+'</p>':'')+'<a class="btn" href="'+APP+'">'+tr('Ilovani ochish')+'</a><a class="btn ghost" href="/">'+tr('Saytga qaytish')+'</a></div>';return}
 var qs=SV.q.filter(shown),need=qs.filter(function(q){return !q.opt}),got=need.filter(filled).length;
 var h='<p class="intro">'+tr("Oldi-Berdi'ni siz uchun qulayroq qilmoqchimiz. Bir necha savolga javob bering — 2 daqiqa vaqt oladi.")+'</p><div class="prog"><i style="width:'+Math.round(got/need.length*100)+'%"></i></div><div class="pt">'+got+'/'+need.length+'</div>';
 qs.forEach(function(q,k){var v=SV.ans[q.id],b='';
  if(q.type==='one'||q.type==='many'){b='<div class="opts">'+q.o.map(function(o,i){var on=q.type==='one'?v===i:Array.isArray(v)&&v.indexOf(i)>=0;return '<button type="button" class="opt'+(on?' on':'')+'" data-q="'+q.id+'" data-i="'+i+'"><span class="box '+q.type+'">'+(on?CHK:'')+'</span>'+esc(vl(o))+'</button>'}).join('')+'</div>'}
  else if(q.type==='scale'||q.type==='nps'){var a=q.type==='nps'?0:1,z=q.type==='nps'?10:5,c='';for(var i=a;i<=z;i++)c+='<button type="button" class="num'+(v===i?' on':'')+'" data-q="'+q.id+'" data-i="'+i+'">'+i+'</button>';b='<div class="scale '+q.type+'">'+c+'</div><div class="lohi"><span>'+a+' — '+esc(vl(q.lo))+'</span><span>'+z+' — '+esc(vl(q.hi))+'</span></div>'}
  else b='<textarea class="inp" rows="3" maxlength="1000" data-t="'+q.id+'" placeholder="'+esc(vl(q.ph))+'">'+esc(v||'')+'</textarea>';
  h+='<div class="q'+(SV.err&&!q.opt&&!filled(q)?' miss':'')+'"><div class="t"><span class="n">'+(k+1)+'</span><b>'+esc(vl(q.t))+'</b>'+(q.opt?'<small>'+tr('ixtiyoriy')+'</small>':q.type==='many'?'<small>'+tr('bir nechtasini tanlang')+'</small>':'')+'</div>'+b+'</div>'});
 var vid=SV.ans.q10===0||SV.ans.q10===1;
 h+='<div class="q"><div class="t"><span class="n">✓</span><b>'+tr('Ismingiz va telefoningiz')+'</b><small>'+(vid?tr('video uchun kerak'):tr("Ilovada akkauntingizdagi raqamni yozsangiz, javob sizning akkauntingizga bog'lanadi."))+'</small></div><div class="row2"><input class="inp" id="nm" maxlength="80" placeholder="'+tr('Ism')+'" value="'+esc(SV.name)+'"><input class="inp" id="ph" type="tel" inputmode="tel" placeholder="+998 __ ___ __ __" value="'+esc(SV.phone)+'"></div></div>';
 h+='<div class="err" id="er">'+esc(SV.err)+'</div><button class="btn" id="go">'+SEND+' '+tr('Javobni yuborish')+'</button>';
 box.innerHTML=h}
function keep(){[].forEach.call(document.querySelectorAll('[data-t]'),function(t){var v=t.value.trim();if(v)SV.ans[t.dataset.t]=v;else delete SV.ans[t.dataset.t]});var n=$('#nm'),p=$('#ph');if(n)SV.name=n.value;if(p)SV.phone=p.value;save()}
function redraw(){var y=window.pageYOffset;draw();window.scrollTo(0,y)}
document.addEventListener('input',function(e){if(e.target.matches('[data-t],#nm,#ph'))keep()});
document.addEventListener('click',function(e){var l=e.target.closest('.lang button');if(l){keep();L=l.dataset.l;redraw();return}
 var b=e.target.closest('[data-q]');if(b){keep();var q=SV.q.filter(function(x){return x.id===b.dataset.q})[0],i=+b.dataset.i;if(!q)return;
  if(q.type==='many'){var v=Array.isArray(SV.ans[q.id])?SV.ans[q.id].slice():[];if(v.indexOf(i)>=0)v=v.filter(function(x){return x!==i});else{if(q.id==='q6'&&i===6)v=[];else if(q.id==='q6')v=v.filter(function(x){return x!==6});v.push(i)}SV.ans[q.id]=v}else SV.ans[q.id]=i;
  save();redraw();return}
 if(e.target.closest('#go'))submit(e.target.closest('#go'))});
function submit(el){keep();var qs=SV.q.filter(shown),miss=qs.filter(function(q){return !q.opt&&!filled(q)});
 if(miss.length){SV.err=tr('Iltimos, belgilangan savollarga javob bering');redraw();var m=$('.q.miss');if(m)m.scrollIntoView({behavior:'smooth',block:'center'});return}
 var vid=SV.ans.q10===0||SV.ans.q10===1,ph=normPhone(SV.phone);if(vid&&ph.length<9){SV.err=tr('Video uchun telefon raqamingizni yozing');redraw();var p=$('#ph');if(p)p.focus();return}
 var ans={};qs.forEach(function(q){if(SV.ans[q.id]!==undefined)ans[q.id]=SV.ans[q.id]});
 el.disabled=true;el.textContent=tr('Yuborilmoqda…');
 api('surveySubmit',{answers:ans,name:SV.name.trim(),phone:ph,src:Q.get('from')==='app'?'app-site':'site'}).then(function(){SV.done=true;SV.vid=vid;SV.err='';try{localStorage.removeItem(KEY)}catch(e){}draw();window.scrollTo(0,0)}).catch(function(e){SV.err=e.message;redraw()})}
api('surveyGet',{}).then(function(j){SV.q=j.q;SV.on=j.on;draw()}).catch(function(e){$('#box').innerHTML='<p style="text-align:center"><b>'+esc(e.message)+'</b></p><button class="btn" onclick="location.reload()">↻</button>'});
draw();
</script>
</body>
</html>
