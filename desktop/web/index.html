<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oldi-Berdi</title>
<style>html,body{margin:0;height:100%;background:#edf5ef;color:#0e2a1b;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.c{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
.i{width:76px;height:76px;border-radius:24px;background:linear-gradient(150deg,#1a9c55,#0b5c33);color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:34px;box-shadow:0 14px 30px -14px rgba(11,92,51,.7)}
h1{font-size:22px;margin:0 0 8px}p{color:#5b7465;margin:0 auto 22px;max-width:320px;line-height:1.5}
button{height:48px;padding:0 26px;border:0;border-radius:14px;background:#13894a;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid #dbe7de;border-top-color:#13894a;animation:s .8s linear infinite;margin:0 auto}@keyframes s{to{transform:rotate(360deg)}}</style></head>
<body><div class="c" id="c"><div><div class="sp"></div></div></div>
<script>
const APP_URL='https://xusniddin-del.github.io/Oldi-berdi-ilovasi/';   // ilova manzili (keyin: https://app.oldiberdi.uz/)
function go(){if(navigator.onLine){location.replace(APP_URL);return}
 document.getElementById('c').innerHTML='<div><div class="i">📶</div><h1>Internet yo\'q</h1><p>Oldi-Berdi ma\'lumotlari internetda saqlanadi. Internetga ulaning va qayta urinib ko\'ring.</p><button onclick="go()">Qayta urinish</button></div>'}
addEventListener('online',go);go();
</script></body></html>
