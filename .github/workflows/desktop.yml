# Windows (.exe) va Mac (.dmg) dasturlarini yig'adi va GitHub Releases'ga joylaydi (Tauri — kichik hajm).
# Ishga tushirish: Actions → "Kompyuter dasturi" → Run workflow (versiya raqamini yozing, masalan 1.1.1)
name: Kompyuter dasturi
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versiya (masalan 1.1.1)'
        required: true
        default: '1.1.0'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            out: Oldi-Berdi-Setup.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            out: Oldi-Berdi.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - name: Versiya
        run: |
          V='${{ inputs.version }}'
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$V';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - run: npx tauri build ${{ matrix.args }}
      - name: Faylni nomlash
        run: |
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows-latest" ]; then cp src-tauri/target/release/bundle/nsis/*.exe "out/${{ matrix.out }}";
          else cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/${{ matrix.out }}"; fi
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Oldi-Berdi ${{ inputs.version }}
          body: |
            Oldi-Berdi kompyuter dasturi.
            • Windows: Oldi-Berdi-Setup.exe
            • Mac: Oldi-Berdi.dmg
          files: desktop/out/${{ matrix.out }}
          make_latest: true
