# Windows (.exe) va Mac (.dmg) dasturlarini yig'adi va GitHub Releases'ga joylaydi.
# Ishga tushirish: Actions → "Kompyuter dasturi" → Run workflow (versiya raqamini yozing, masalan 1.0.0)
name: Kompyuter dasturi
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versiya (masalan 1.0.1)'
        required: true
        default: '1.0.0'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: dist:win
            file: desktop/dist/Oldi-Berdi-Setup.exe
          - os: macos-latest
            cmd: dist:mac
            file: desktop/dist/Oldi-Berdi.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Oldi-Berdi ${{ inputs.version }}
          body: |
            Oldi-Berdi kompyuter dasturi.
            • Windows: Oldi-Berdi-Setup.exe
            • Mac: Oldi-Berdi.dmg
          files: ${{ matrix.file }}
          make_latest: true
