# Windows (.exe) va Mac (.dmg) dasturlarini yig'adi va GitHub Releases'ga joylaydi (Tauri — kichik hajm).
# Ishga tushirish: Actions → "Kompyuter dasturi" → Run workflow (versiya raqamini yozing, masalan 1.1.1)
name: Kompyuter dasturi
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versiya (masalan 1.1.1)'
        required: true
        default: '1.1.0'
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            out: Oldi-Berdi-Setup.exe
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            out: Oldi-Berdi.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - name: Versiya
        run: |
          V='${{ inputs.version }}'
          node -e "const f='src-tauri/tauri.conf.json',j=require('./'+f);j.version='$V';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - run: npx tauri build ${{ matrix.args }}
      - name: Faylni nomlash
        run: |
          mkdir -p out
          if [ "${{ matrix.os }}" = "windows-latest" ]; then cp src-tauri/target/release/bundle/nsis/*.exe "out/${{ matrix.out }}";
          else cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/${{ matrix.out }}"; fi
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Oldi-Berdi ${{ inputs.version }}
          body: |
            Oldi-Berdi kompyuter dasturi.
            • Windows 10, 11: Oldi-Berdi-Setup.exe
            • Windows 7, 8, 8.1: Oldi-Berdi-Setup-Win7.exe (yengil, Chrome/Yandex kerak) yoki to'liq versiya -Win7-64bit / -32bit.exe
            • Mac: Oldi-Berdi.dmg
          files: desktop/out/${{ matrix.out }}
          make_latest: true

  # Windows 7, 8, 8.1 — yengil o'rnatuvchi (~200 KB): kompyuterdagi Chrome/Yandex/Edge'da ilovani alohida oynada ochadi
  win7-light:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-win7
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q nsis
      - run: makensis -V2 -DVERSION=${{ inputs.version }} oldiberdi.nsi && ls -la *.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Oldi-Berdi ${{ inputs.version }}
          files: desktop-win7/Oldi-Berdi-Setup-Win7.exe
          make_latest: true

  # Windows 7, 8, 8.1 — to'liq versiya (Electron 22, ~60 MB): brauzer bo'lmagan kompyuterlar uchun
  legacy:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-legacy
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run dist:x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run dist:ia32
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Faylni nomlash
        run: |
          mkdir -p out
          cp dist/Oldi-Berdi-Win7-x64.exe out/Oldi-Berdi-Setup-Win7-64bit.exe
          cp dist/Oldi-Berdi-Win7-ia32.exe out/Oldi-Berdi-Setup-Win7-32bit.exe
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Oldi-Berdi ${{ inputs.version }}
          files: |
            desktop-legacy/out/Oldi-Berdi-Setup-Win7-64bit.exe
            desktop-legacy/out/Oldi-Berdi-Setup-Win7-32bit.exe
          make_latest: true
